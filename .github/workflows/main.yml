name: Build

on:
  push:
    branches:
      - master
      - develop
  pull_request: 
    branches: [ master ]
  workflow_dispatch:

env:
  ANDROID_FRAMEWORK: net10.0-android
  WEAROS_FRAMEWORK: net10.0-android
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android platform tools
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install platform-tools

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Run tests
        run: dotnet test --configuration $CONFIGURATION --no-restore --collect:"XPlat Code Coverage" --results-directory ./coverage Spider2FA.Test/Spider2FA.Test.csproj

      - name: Publish Android
        run: |
          REF=$(echo $GITHUB_SHA | cut -c -7)
          sed -i "s|package=\"com.spider2fa.app\"|package=\"com.spider2fa.app.$REF\"|g" Spider2FA.Droid/Properties/AndroidManifest.xml
          sed -i "s|<string name=\"displayName\" translatable=\"false\">Authenticator</string>|<string name=\"displayName\" translatable=\"false\">Authenticator ($REF)</string>|g" Spider2FA.Droid/Resources/values/strings.xml

          dotnet publish -f:$ANDROID_FRAMEWORK -c:$CONFIGURATION --no-restore Spider2FA.Droid/Spider2FA.Droid.csproj
          APK=$(find Spider2FA.Droid/bin/$CONFIGURATION/$ANDROID_FRAMEWORK/publish -name '*-Signed.apk')
          mv $APK "com.spider2fa.app.$REF.apk"

      - name: Publish Wear OS
        run: |
          REF=$(echo $GITHUB_SHA | cut -c -7)
          sed -i "s|package=\"com.spider2fa.app\"|package=\"com.spider2fa.app.$REF\"|g" Spider2FA.WearOS/Properties/AndroidManifest.xml
          sed -i "s|<string name=\"displayName\" translatable=\"false\">Authenticator</string>|<string name=\"displayName\" translatable=\"false\">Authenticator ($REF)</string>|g" Spider2FA.WearOS/Resources/values/strings.xml

          dotnet publish -f:$WEAROS_FRAMEWORK -c:$CONFIGURATION --no-restore Spider2FA.WearOS/Spider2FA.WearOS.csproj
          APK=$(find Spider2FA.WearOS/bin/$CONFIGURATION/$WEAROS_FRAMEWORK/publish -name '*-Signed.apk')
          mv $APK "com.spider2fa.app.wearos.$REF.apk"

      - name: Generate coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both
          thresholds: '60 80'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spider2FA
          path: |
            com.spider2fa.app*.apk
            code-coverage-results.md
